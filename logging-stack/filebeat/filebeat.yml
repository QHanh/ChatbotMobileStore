filebeat.inputs:
  # ChatbotMobileStore logs
  - type: log
    enabled: true
    paths:
      - /var/log/chatbotmobilestore/*.log
    json.keys_under_root: true
    json.overwrite_keys: true
    json.add_error_key: true
    fields:
      service.name: chatbotmobilestore-api
    fields_under_root: true

  # dangbaitudong logs (mounted from remote or shared volume)
  - type: log
    enabled: true
    paths:
      - /var/log/dangbaitudong/*.log
    json.keys_under_root: true
    json.overwrite_keys: true
    json.add_error_key: true
    fields:
      service.name: dangbaitudong-api
    fields_under_root: true

processors:
  - timestamp:
      field: "@timestamp"
      layouts:
        - '2006-01-02T15:04:05.999999Z07:00'
        - '2006-01-02T15:04:05Z07:00'
      test:
        - '2024-01-15T10:30:00.123456Z'
  - add_host_metadata:
      when.not.contains.tags: forwarded
  - drop_fields:
      fields: ["agent", "ecs", "input", "host.name"]
      ignore_missing: true

output.elasticsearch:
  hosts: ["elasticsearch:9200"]
  index: "app-logs-%{+yyyy.MM.dd}"

setup.template.name: "app-logs"
setup.template.pattern: "app-logs-*"
setup.template.settings:
  index.number_of_shards: 1
  index.number_of_replicas: 0

setup.ilm.enabled: false

logging.level: info
logging.to_files: true
logging.files:
  path: /var/log/filebeat
  name: filebeat
  keepfiles: 3
  permissions: 0640
